<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotobox — Galerie</title>
    <link rel="stylesheet" href="/gallery.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__info">
        <h1 id="event-name">Galerie</h1>
        <p id="event-count" class="muted"></p>
      </div>
      <div class="topbar__actions">
        <!-- Admin-Modus (?admin=1): Hauptgalerie über alle Veranstaltungen. -->
        <select id="event-pick" class="event-pick hidden" aria-label="Veranstaltung"></select>
        <a id="back-to-box" class="download hidden" href="/">Zurück zur Fotobox</a>
        <div class="toggle" id="variant-toggle" role="group" aria-label="Ansicht">
          <button type="button" data-variant="processed" class="toggle__btn is-active">
            Mit Hintergrund
          </button>
          <button type="button" data-variant="original" class="toggle__btn">Original</button>
        </div>
        <button type="button" id="select-mode" class="toggle__btn select-mode">Auswählen</button>
        <a id="download-all" class="download" href="#">Alle Fotos herunterladen (ZIP)</a>
      </div>
    </header>

    <main>
      <div id="selection-bar" class="selbar hidden">
        <span id="selection-count" class="selbar__count"></span>
        <a id="download-selection" class="download" href="#">Auswahl herunterladen (ZIP)</a>
        <button type="button" id="selection-clear" class="more__btn">Auswahl aufheben</button>
        <button type="button" id="selection-delete" class="more__btn more__btn--danger hidden">
          Auswahl löschen
        </button>
      </div>
      <p id="empty" class="empty hidden">Noch keine Fotos vorhanden.</p>
      <div id="grid" class="grid"></div>
      <div class="more">
        <button type="button" id="load-more" class="more__btn hidden">Mehr laden</button>
      </div>
    </main>

    <div id="lightbox" class="lightbox hidden">
      <div class="lightbox__frame">
        <img id="lightbox-img" alt="" />

        <button type="button" id="lightbox-prev" class="lightbox__nav lightbox__nav--prev"
                aria-label="Vorheriges Foto"><span aria-hidden="true">‹</span></button>
        <button type="button" id="lightbox-next" class="lightbox__nav lightbox__nav--next"
                aria-label="Nächstes Foto"><span aria-hidden="true">›</span></button>

        <button type="button" id="lightbox-close" class="lightbox__close"
                aria-label="Schließen"><span aria-hidden="true">×</span></button>

        <span id="lightbox-count" class="lightbox__count"></span>
        <span id="lightbox-note" class="lightbox__note"></span>

        <button type="button" id="lightbox-print" class="lightbox__print"
                aria-label="Dieses Foto drucken" title="Dieses Foto drucken">
          <!-- Inline, kein Netzwerkzugriff zur Laufzeit (Regel 7). -->
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 3h10v4H7z" />
            <path d="M5 8h14a2 2 0 0 1 2 2v6h-4v-3H7v3H3v-6a2 2 0 0 1 2-2z" />
            <path d="M8 15h8v6H8z" />
          </svg>
        </button>
      </div>
    </div>
    </div>

    <script src="/gallery.js"></script>
  </body>
</html>
