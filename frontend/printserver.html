<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotobox — Druckermodus</title>
    <!-- Bewusst ohne /style.css: dort ist jeder Screen bis zu einem Zustand des
         Automaten ausgeblendet, und diese Seite gehört zu keinem. Kein Skript,
         kein Abrufen im Hintergrund — der Bildschirm soll nur etwas sagen. -->
    <style>
      :root {
        --bg: #111;
        --fg: #fff;
        --muted: #cfcfcf;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 3vh;
        padding: 5vh;
        cursor: none;
      }
      h1 {
        font-size: 7vh;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        font-size: 3vh;
        color: var(--muted);
        line-height: 1.5;
      }
      .back {
        margin-top: 2vh;
        padding: 3vh 5vh;
        border: 2px solid #333;
        border-radius: 2vh;
      }
      .back strong {
        color: var(--fg);
      }
      code {
        font-size: 2.6vh;
        color: #9fd0ff;
      }
    </style>
  </head>
  <body>
    <h1>Druckermodus</h1>
    <p>
      Diese Box arbeitet gerade als Netzwerkdrucker.<br />
      Sie macht gerade keine Fotos.
    </p>
    <div class="back">
      <p>
        Zurück zur Fotobox: <strong>Kamera anstecken</strong><br />
        oder im Browser <code>http://fotobox.local/admin</code>
      </p>
    </div>
  </body>
</html>
